<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #eef5ff; color: #172b4d; font-family: system-ui, sans-serif; }
    main { width: min(100%, 520px); padding: 64px 24px; text-align: center; background: white; border-radius: 24px; box-shadow: 0 16px 48px #284b7c12; }
    h1 { margin: 0 0 16px; font-size: clamp(36px, 8vw, 56px); letter-spacing: -2px; }
    p { margin: 0; font-size: 18px; line-height: 1.7; color: #60708b; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World 👋</h1>
    <p>你好，世界！我的第一个网页。</p>
  </main>
</body>
</html>
